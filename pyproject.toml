[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pebble-lang"
version = "0.1.0"
description = "A tiny, dependency-free scripting language: lexer, parser, evaluator and REPL"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AI Assistant" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
pebble = "pebble.cli:main"
